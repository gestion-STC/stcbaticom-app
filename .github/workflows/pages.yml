# Publication automatique : chaque push sur main verifie la qualite (tests +
# lint) et publie sur GitHub Pages (depuis la fusion dans STC : la page de redirection relais/pages)
# (gestion-stc.github.io/stcbaticom-app).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:      # permet de relancer a la main depuis l'onglet Actions
permissions:
  contents: read
  pages: write
  id-token: write
jobs:

  # ETAPE 1 — Qualite : fait tourner les tests (vitest) et le lint (eslint).
  # Les TESTS sont bloquants ("build-deploy" porte "needs: qualite") : un test
  # rouge empeche la mise en ligne, et le site reste dans sa derniere version
  # publiee. Le lint, lui, reste informatif (voir plus bas).
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Tests (vitest)
        run: npm run test
      # Santé du code (14/10) : BLOQUANTS — typage strict, lint du logiciel sans erreur,
      # aucune boucle d'imports. Une dégradation empêche la mise en ligne.
      - name: Typage strict (tsc)
        run: npx tsc -b
      - name: Lint du logiciel (src)
        run: npx eslint src
      - name: Boucles d'imports (madge)
        run: npx -y madge@8.0.0 --circular --extensions ts,tsx src
      - name: Lint (eslint)
        run: npm run lint
        # NON bloquant : 8 erreurs de style/typage preexistantes (any, espace
        # invisible, erreur relancee sans cause). Elles ne cassent rien mais
        # empechaient toute publication. A nettoyer fichier par fichier, puis
        # retirer cette ligne pour rendre le lint bloquant lui aussi.
        continue-on-error: true

  # ETAPE 2 — Build et mise en ligne. Ne demarre que si "qualite" est vert.
  build-deploy:
    needs: qualite
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      # FUSION DANS STC BÂTIMENT (branche fusion/relais) : on ne publie plus l'application, seulement la page qui
      # renvoie vers https://www.stcbatiment.com/commercial/ en gardant les paramètres des liens déjà envoyés
      # (relais/pages). Retour arrière : annuler la fusion de cette branche, l'application est republiée telle quelle.
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: relais/pages }
      - id: deploiement
        uses: actions/deploy-pages@v4
