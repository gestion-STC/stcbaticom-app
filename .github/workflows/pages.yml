# Publication automatique : chaque push sur main verifie la qualite (tests +
# lint), reconstruit l'app (Vite) et la deploie sur GitHub Pages
# (gestion-stc.github.io/stcbaticom-app).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:      # permet de relancer a la main depuis l'onglet Actions
permissions:
  contents: read
  pages: write
  id-token: write
jobs:

  # ETAPE 1 — Qualite : fait tourner les tests (vitest) et le lint (eslint).
  # Les TESTS sont bloquants ("build-deploy" porte "needs: qualite") : un test
  # rouge empeche la mise en ligne, et le site reste dans sa derniere version
  # publiee. Le lint, lui, reste informatif (voir plus bas).
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Tests (vitest)
        run: npm run test
      - name: Lint (eslint)
        run: npm run lint
        # NON bloquant : 8 erreurs de style/typage preexistantes (any, espace
        # invisible, erreur relancee sans cause). Elles ne cassent rien mais
        # empechaient toute publication. A nettoyer fichier par fichier, puis
        # retirer cette ligne pour rendre le lint bloquant lui aussi.
        continue-on-error: true

  # ETAPE 2 — Build et mise en ligne. Ne demarre que si "qualite" est vert.
  build-deploy:
    needs: qualite
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build -- --base=/stcbaticom-app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploiement
        uses: actions/deploy-pages@v4
